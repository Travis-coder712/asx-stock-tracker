name: Weekly Data Refresh

on:
  schedule:
    - cron: '0 20 * * 0'   # Sundays 20:00 UTC (~Mon 7am AEST) — after the ASX trading week
  workflow_dispatch: {}      # allow manual "Run workflow"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Persist the SQLite DB between runs so imports are incremental.
      # A cache miss just means refresh.py bootstraps full history.
      - name: Restore price database
        uses: actions/cache@v4
        with:
          path: database/asx_tracker.db
          key: asx-db-${{ github.run_id }}
          restore-keys: |
            asx-db-

      - run: pip install -r pipeline/requirements.txt

      - name: Refresh data (import, self-heal, verify, recompute, export)
        run: python pipeline/refresh.py

      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data frontend/package.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git commit -m "chore(data): weekly refresh $(date -u +%Y-%m-%d)"
            git push
          fi

  build:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npx tsc -b && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
